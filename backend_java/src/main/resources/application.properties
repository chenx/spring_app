# Replace this placeholder with your own strong 32+ character key
# jwt.secret-key=MySuperSecretKeyThatIsAtLeast32CharactersLong!
#
# Never share the key or upload it to github. Or use environment variable:
# On Mac, this can be added to ~/.zshrc as:
#   export JWT_SECRET_KEY="your-long-random-secret"
# Then: 
#   source ~/.zshrc
#   echo $JWT_SECRET_KEY  # verify
#
# On production server, this can be added to systemd config:
#   EnvironmentFile=/etc/app_folder/spring_boot.env
#   java -jar app.jar
# Then in spring_boot.env, add: 
#   JWT_SECRET_KEY=your-long-random-secret
jwt.secret-key=${JWT_SECRET_KEY}
