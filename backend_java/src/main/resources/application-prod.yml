server:
  # Uses the cloud provider's port, defaults to 8080 if not found
  port: ${PORT:8080} 

spring:
  application:
    name: demo-fullstack-backend

cors:
  # Replace with your actual live frontend domain
  allowed-origins: http://localhost:5173,http://localhost:3000
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  max-age: 3600
